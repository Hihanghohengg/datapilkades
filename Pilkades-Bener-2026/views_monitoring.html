<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('styles_main'); ?>
  <?!= include('styles_admin'); ?>
  <style>
    .tab-header { display:flex; gap:10px; margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:10px; }
    .tab-btn { padding:8px 16px; border:none; background:transparent; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:3px solid transparent; }
    .tab-btn.active { color:var(--primary); border-bottom-color:var(--primary); }
    .wa-btn { background:#25D366; color:white; padding:6px 12px; border-radius:6px; text-decoration:none; font-size:12px; font-weight:600; display:inline-block; }
    .wa-btn:hover { background:#128C7E; }
  </style>
</head>
<body class="admin-layout">
  
  <?!= include('partials_sidebar'); ?>
  
  <div class="main-content">
    <div class="topbar">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <div>
        <?!= include('partials_notif_icon'); ?>
      </div>
    </div>
    
    <div class="content-wrapper">
      <h2 class="mb-4">Monitoring KK</h2>
      
      <div class="tab-header">
        <button class="tab-btn active" id="tabBelum" onclick="switchTab('belum')">Belum Konfirmasi</button>
        <button class="tab-btn" id="tabSudah" onclick="switchTab('sudah')">Sudah Konfirmasi</button>
      </div>
      
      <div id="loading" class="text-center">Memuat data...</div>
      
      <div class="table-wrapper" id="tableContainer" style="display:none;">
        <table id="tblMonitoring">
          <thead>
            <tr>
              <th>Nama Kepala Keluarga</th>
              <th>Grup KK</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <?!= include('scripts_api_js'); ?>
  <?!= include('scripts_ui_js'); ?>
  <?!= include('scripts_admin_js'); ?>
  <script>
    let kkList = [];

    const token = UI.getStore('adminToken');
    if(token) {
      API.getDashboardStats(token).then(res => {
        document.getElementById('loading').style.display = 'none';
        if(res) {
          document.getElementById('tableContainer').style.display = 'block';
          kkList = res.list || [];
          renderTable('belum');
        }
      });
    }

    function switchTab(tab) {
      document.getElementById('tabBelum').classList.remove('active');
      document.getElementById('tabSudah').classList.remove('active');
      document.getElementById(tab === 'belum' ? 'tabBelum' : 'tabSudah').classList.add('active');
      renderTable(tab);
    }

    function renderTable(tab) {
      const tbody = document.querySelector('#tblMonitoring tbody');
      tbody.innerHTML = '';
      
      let filtered = kkList.filter(kk => {
        if(tab === 'belum') return kk.Status === 'Belum' || kk.Status === 'Menunggu Review';
        return kk.Status === 'Sesuai' || kk.Status === 'Sudah Direvisi';
      });
      
      if(filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Tidak ada data</td></tr>';
        return;
      }
      
      filtered.forEach(kk => {
        let badgeClass = 'badge-baru';
        if(kk.Status === 'Sesuai') badgeClass = 'badge-sesuai';
        if(kk.Status === 'Menunggu Review') badgeClass = 'badge-review';
        if(kk.Status === 'Sudah Direvisi') badgeClass = 'badge-direvisi';
        
        let waText = encodeURIComponent(`Halo Bpk/Ibu ${kk.NamaKepala}, mohon segera melakukan konfirmasi data KK Pilkades melalui link aplikasi.`);
        let actionBtn = tab === 'belum' ? `<a href="https://wa.me/?text=${waText}" target="_blank" class="wa-btn">Kirim Link WA</a>` : '-';
        
        tbody.innerHTML += `
          <tr>
            <td><div style="font-weight:600;">${kk.NamaKepala || "-"}</div></td>
            <td>${kk.GrupKK}</td>
            <td><span class="badge ${badgeClass}">${kk.Status}</span></td>
            <td>${actionBtn}</td>
          </tr>
        `;
      });
    }
  </script>
</body>
</html>
