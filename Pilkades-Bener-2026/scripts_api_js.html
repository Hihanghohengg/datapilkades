<script>
  const API = {
    call: function(serverFunction, ...args) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          [serverFunction](...args);
      });
    },
    
    // Auth
    loginWarga: (nama, tgl) => API.call('loginWarga', nama, tgl),
    loginAdmin: (pass) => API.call('loginAdmin', pass),
    
    // Warga
    getKeluarga: (grupKK) => API.call('getKeluargaByGrupKK', grupKK),
    submitSesuai: (grupKK, nama) => API.call('submitLaporanSesuai', grupKK, nama),
    submitPerubahan: (grupKK, nama, tgl, jenis, data) => API.call('submitLaporanPerubahan', grupKK, nama, tgl, jenis, JSON.stringify(data)),
    
    // Admin
    getDashboardStats: (token) => API.call('getDashboardStats', token),
    getNotifCount: (token) => API.call('getNotifCount', token),
    getLaporanList: (token) => API.call('getLaporanList', token),
    markAsRead: (token, id) => API.call('markLaporanAsRead', token, id),
    approveLaporan: (token, id, jenis, data, grupKK) => API.call('approveLaporan', token, id, jenis, JSON.stringify(data), grupKK),
    tolakLaporan: (token, id, cat) => API.call('tolakLaporan', token, id, cat),
    updateWargaBatch: (token, updates) => API.call('updateWargaBatch', token, updates),
    generatePDF: (grupKK) => API.call('generatePdfForKK', grupKK)
  };
</script>
