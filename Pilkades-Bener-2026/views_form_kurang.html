<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('styles_main'); ?>
</head>
<body>
  <div class="container">
    <div class="card">
      <div style="margin-bottom: 16px;">
        <a href="#" onclick="UI.navigate('pilih-perubahan'); return false;" style="text-decoration:none; color:var(--primary); font-weight:600;">← Kembali</a>
      </div>
      <h2 class="mb-2">Kurangi Anggota Keluarga</h2>
      <p class="text-muted mb-4">ℹ️ Laporan akan ditinjau admin.</p>
      
      <div id="errorAlert" class="alert alert-error"></div>
      
      <label>Pilih Nama *</label>
      <select id="inpNama">
        <option value="">Pilih anggota...</option>
        <!-- JS will populate -->
      </select>
      
      <label>Keterangan *</label>
      <select id="inpKet" onchange="checkLainnya(this)">
        <option value="">Pilih alasan...</option>
        <option value="Pindah">Pindah Domisili</option>
        <option value="Meninggal">Meninggal Dunia</option>
        <option value="TNI/Polri">TNI / Polri</option>
        <option value="Menikah & Pindah">Menikah & Pindah KK</option>
        <option value="Lainnya">Lainnya</option>
      </select>
      
      <div id="divLainnya" style="display:none;">
        <label>Alasan Lainnya *</label>
        <textarea id="inpLainnya" rows="3" placeholder="Tuliskan alasan..."></textarea>
      </div>
      
      <button class="btn btn-primary mt-4" id="btnSubmit" onclick="kirimLaporan()">KIRIM LAPORAN</button>
    </div>
  </div>

  <?!= include('scripts_api_js'); ?>
  <?!= include('scripts_ui_js'); ?>
  <?!= include('scripts_app_js'); ?>
  <script>
    if (!UI.getStore('wargaAuth')) {
      UI.navigate('login');
    }
    const dataKk = UI.getStore('wargaData');
    if(dataKk) {
      const sel = document.getElementById('inpNama');
      dataKk.forEach(p => {
        sel.innerHTML += `<option value="${p.Nama}">${p.Nama}</option>`;
      });
    }

    function checkLainnya(el) {
      document.getElementById('divLainnya').style.display = el.value === 'Lainnya' ? 'block' : 'none';
    }

    function kirimLaporan() {
      const nama = document.getElementById('inpNama').value;
      const ket = document.getElementById('inpKet').value;
      const lainnya = document.getElementById('inpLainnya').value;
      
      if(!nama || !ket) {
        UI.showError("Pilih nama dan keterangan.");
        return;
      }
      
      if(ket === "Lainnya" && !lainnya) {
        UI.showError("Isi alasan lainnya.");
        return;
      }
      
      const payload = {
        Nama: nama,
        Alasan: ket === "Lainnya" ? lainnya : ket
      };
      
      UI.setLoading('btnSubmit', true);
      const auth = UI.getStore('wargaAuth');
      
      API.submitPerubahan(auth.userGrupKK, auth.userNama, "-", "Kurang Orang", payload).then(res => {
        UI.setLoading('btnSubmit', false);
        if(res.success) {
          UI.store('statusLaporan', 'perubahan');
          UI.navigate('sukses');
        } else {
          UI.showError(res.message);
        }
      });
    }
  </script>
</body>
</html>
