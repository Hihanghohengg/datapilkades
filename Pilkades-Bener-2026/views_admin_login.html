<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('styles_main'); ?>
</head>
<body>
  <div class="container" style="margin-top: 50px;">
    <div class="card">
      <div style="margin-bottom: 20px;">
        <a href="#" onclick="UI.navigate('login'); return false;" style="text-decoration:none; color:var(--primary); font-weight:600;">← Kembali</a>
      </div>
      
      <h2 class="text-center mb-4">Login Admin Pantarlih</h2>
      
      <div id="errorAlert" class="alert alert-error"></div>
      
      <label>Password</label>
      <input type="password" id="password" placeholder="Masukkan password admin">
      
      <button class="btn btn-primary" id="btnLogin" onclick="doAdminLogin()">LOGIN</button>
    </div>
  </div>

  <?!= include('scripts_api_js'); ?>
  <?!= include('scripts_ui_js'); ?>
  <script>
    function doAdminLogin() {
      const pass = document.getElementById('password').value;
      if(!pass) {
        UI.showError("Password tidak boleh kosong");
        return;
      }
      
      UI.setLoading('btnLogin', true);
      
      API.loginAdmin(pass).then(res => {
        UI.setLoading('btnLogin', false);
        if(res.success) {
          UI.store('adminToken', res.token);
          UI.navigate('dashboard');
        } else {
          UI.showError(res.message);
        }
      }).catch(e => {
        UI.setLoading('btnLogin', false);
        UI.showError("Kesalahan sistem.");
      });
    }
  </script>
</body>
</html>
