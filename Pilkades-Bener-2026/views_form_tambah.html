<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('styles_main'); ?>
</head>
<body>
  <div class="container">
    <div class="card">
      <div style="margin-bottom: 16px;">
        <a href="#" onclick="UI.navigate('pilih-perubahan'); return false;" style="text-decoration:none; color:var(--primary); font-weight:600;">← Kembali</a>
      </div>
      <h2 class="mb-2">Tambah Anggota Keluarga</h2>
      <p class="text-muted mb-4">ℹ️ Laporan akan ditinjau admin sebelum masuk ke database.</p>
      
      <div id="errorAlert" class="alert alert-error"></div>
      
      <label>Nama Lengkap *</label>
      <input type="text" id="inpNama" autocomplete="off">
      
      <label>NIK (opsional)</label>
      <input type="text" id="inpNIK" autocomplete="off">
      
      <label>Jenis Kelamin *</label>
      <select id="inpJK">
        <option value="">Pilih...</option>
        <option value="LAKI-LAKI">LAKI-LAKI</option>
        <option value="PEREMPUAN">PEREMPUAN</option>
      </select>
      
      <label>Tempat Lahir *</label>
      <input type="text" id="inpTempat" autocomplete="off">
      
      <label>Tanggal Lahir * <span class="text-muted" style="font-weight:normal">(Umur otomatis dihitung)</span></label>
      <div style="display:flex; gap:10px; margin-bottom:16px;">
        <select id="tgl_dd"><option value="">Tgl</option></select>
        <select id="tgl_mm"><option value="">Bulan</option></select>
        <select id="tgl_yy"><option value="">Tahun</option></select>
      </div>
      
      <label>Status Perkawinan *</label>
      <select id="inpStatus">
        <option value="">Pilih...</option>
        <option value="KAWIN">KAWIN</option>
        <option value="BELUM KAWIN">BELUM KAWIN</option>
        <option value="CERAI MATI">CERAI MATI</option>
        <option value="CERAI HIDUP">CERAI HIDUP</option>
      </select>
      
      <label>Hubungan Keluarga *</label>
      <select id="inpHub">
        <option value="">Pilih...</option>
        <option value="KEPALA KELUARGA">KEPALA KELUARGA</option>
        <option value="ISTRI">ISTRI</option>
        <option value="ANAK">ANAK</option>
        <option value="LAINNYA">LAINNYA</option>
      </select>
      
      <label>Alamat *</label>
      <input type="text" id="inpAlamat" autocomplete="off">
      
      <label>Disabilitas (opsional)</label>
      <select id="inpDis">
        <option value="">TIDAK ADA</option>
        <option value="FISIK">FISIK</option>
        <option value="NETRA">NETRA</option>
        <option value="RUNGU/WICARA">RUNGU/WICARA</option>
        <option value="MENTAL">MENTAL</option>
        <option value="LAINNYA">LAINNYA</option>
      </select>
      
      <label>Keterangan (opsional)</label>
      <input type="text" id="inpKet" autocomplete="off">
      
      <button class="btn btn-primary mt-4" id="btnSubmit" onclick="kirimLaporan()">KIRIM LAPORAN</button>
    </div>
  </div>

  <?!= include('scripts_api_js'); ?>
  <?!= include('scripts_ui_js'); ?>
  <?!= include('scripts_app_js'); ?>
  <script>
    // Populate dropdowns
    const dd = document.getElementById('tgl_dd');
    for(let i=1; i<=31; i++) dd.innerHTML += `<option value="${i<10?'0'+i:i}">${i}</option>`;
    const mm = document.getElementById('tgl_mm');
    for(let i=1; i<=12; i++) mm.innerHTML += `<option value="${i<10?'0'+i:i}">${i}</option>`;
    const yy = document.getElementById('tgl_yy');
    for(let i=new Date().getFullYear(); i>=1920; i--) yy.innerHTML += `<option value="${i}">${i}</option>`;
    
    // Auto fill alamat if possible
    const dataKk = UI.getStore('wargaData');
    if(dataKk && dataKk.length > 0) {
      document.getElementById('inpAlamat').value = dataKk[0].Alamat || "";
    }

    function kirimLaporan() {
      const payload = {
        Nama: document.getElementById('inpNama').value,
        NIK: document.getElementById('inpNIK').value,
        JK: document.getElementById('inpJK').value,
        TempatLahir: document.getElementById('inpTempat').value,
        TglLahir: `${dd.value}-${mm.value}-${yy.value}`,
        Status: document.getElementById('inpStatus').value,
        Hubungan: document.getElementById('inpHub').value,
        Alamat: document.getElementById('inpAlamat').value,
        Disabilitas: document.getElementById('inpDis').value,
        Keterangan: document.getElementById('inpKet').value
      };
      
      if(!payload.Nama || !payload.JK || !payload.TempatLahir || !dd.value || !mm.value || !yy.value || !payload.Status || !payload.Hubungan || !payload.Alamat) {
        UI.showError("Lengkapi semua kolom wajib (*)");
        return;
      }
      
      UI.setLoading('btnSubmit', true);
      const auth = UI.getStore('wargaAuth');
      payload.KepalaKeluarga = dataKk[0].KepalaKeluarga || auth.nama;
      
      // We don't have user's DOB in auth, but it doesn't strictly matter for the Laporan row, just pass "-"
      API.submitPerubahan(auth.grupKK, auth.nama, "-", "Tambah Orang", payload).then(res => {
        UI.setLoading('btnSubmit', false);
        if(res.success) {
          UI.store('statusLaporan', 'perubahan');
          UI.navigate('sukses');
        } else {
          UI.showError(res.message);
        }
      });
    }
  </script>
</body>
</html>
