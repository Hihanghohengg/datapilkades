<style>
  body.admin-layout { 
    padding: 0; 
    display: flex; 
    height: 100vh; 
    overflow: hidden; 
    background: var(--bg); 
    background-image: none;
  }
  
  .sidebar { 
    width: 250px; 
    background: var(--surface); 
    border-right: 1px solid var(--border); 
    display: flex; 
    flex-direction: column; 
    height: 100%; 
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
    z-index: 40;
    box-shadow: var(--shadow-xs);
  }
  .sidebar-header { 
    padding: 20px 20px; 
    border-bottom: 1px solid var(--border); 
    font-weight: 700; 
    font-size: 17px; 
    color: var(--neutral); 
    display: flex;
    align-items: center;
    gap: 10px;
    letter-spacing: -0.02em;
  }
  .sidebar-nav { flex: 1; padding: 16px 12px; overflow-y: auto; display: flex; flex-direction: column; }
  .nav-item { 
    display: flex; 
    align-items: center; 
    padding: 10px 14px; 
    margin-bottom: 6px;
    color: var(--muted); 
    text-decoration: none; 
    font-weight: 500;
    font-size: 14px;
    border-radius: var(--radius-sm);
    transition: var(--transition);
    border-left: 3px solid transparent;
  }
  .nav-item:hover { 
    background: var(--primary-light); 
    color: var(--primary); 
  }
  .nav-item.active { 
    background: var(--primary-light); 
    color: var(--primary); 
    font-weight: 600; 
    border-left-color: var(--primary);
  }
  
  .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
  .topbar { 
    height: 60px; 
    background: var(--surface); 
    border-bottom: 1px solid var(--border); 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    padding: 0 24px; 
    z-index: 10;
  }
  .content-wrapper { flex: 1; padding: 28px; overflow-y: auto; }
  
  .badge { 
    display: inline-flex; 
    align-items: center; 
    padding: 3px 10px; 
    border-radius: 999px; 
    font-size: 11.5px; 
    font-weight: 600; 
    letter-spacing: 0.02em; 
  }
  .badge-baru { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
  .badge-sesuai { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
  .badge-review { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
  .badge-direvisi { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
  
  .table-wrapper { 
    overflow-x: auto; 
    background: var(--surface); 
    border-radius: var(--radius); 
    border: 1px solid var(--border); 
    box-shadow: var(--shadow-xs);
  }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  th, td { padding: 14px 18px; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  th { background: #f8fafc; font-weight: 600; color: #475569; text-transform: uppercase; font-size: 11.5px; letter-spacing: 0.04em; }
  tr:last-child td { border-bottom: none; }
  tr { transition: background 0.15s; }
  tr:hover { background: #f8fafc; }
  
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  
  .clickable-card { 
    cursor: pointer; 
    transition: var(--transition); 
  }
  .clickable-card:hover { 
    transform: translateY(-2px); 
    box-shadow: var(--shadow-md); 
  }
  
  @media (max-width: 768px) {
    .sidebar { position: absolute; transform: translateX(-100%); box-shadow: 4px 0 24px rgba(15,23,42,0.12); }
    .sidebar.open { transform: translateX(0); }
    .content-wrapper { padding: 16px 12px; }
    .topbar { padding: 0 16px; }
    .menu-toggle { display: block !important; }
  }
  .menu-toggle { 
    display: none; 
    background: none; 
    border: none; 
    font-size: 22px; 
    cursor: pointer; 
    color: var(--neutral); 
    padding: 6px 10px; 
    border-radius: var(--radius-sm); 
  }
  .menu-toggle:hover { background: #f1f5f9; }
</style>
