<div id="modalEdit" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:100; align-items:center; justify-content:center;">
  <div class="card" style="width:90%; max-width:400px; max-height:90vh; overflow-y:auto;">
    <h2>Edit Anggota</h2>
    <input type="hidden" id="editRowIdx">
    <label>Nama</label> <input type="text" id="editNama">
    <label>NIK</label> <input type="text" id="editNIK">
    <label>JK</label> 
    <select id="editJK"><option>LAKI-LAKI</option><option>PEREMPUAN</option></select>
    <div class="grid-2" style="margin-bottom:0; gap:10px;">
      <div><label>Tempat Lahir</label> <input type="text" id="editTempat"></div>
      <div><label>Tgl Lahir</label> <input type="text" id="editTgl" placeholder="DD/MM/YYYY"></div>
    </div>
    <label>Status</label>
    <select id="editStatus"><option>KAWIN</option><option>BELUM KAWIN</option><option>CERAI MATI</option><option>CERAI HIDUP</option></select>
    <label>Alamat</label> <input type="text" id="editAlamat">
    <div style="display:flex; gap:10px; margin-top:20px;">
      <button class="btn btn-outline" onclick="document.getElementById('modalEdit').style.display='none'">Batal</button>
      <button class="btn btn-primary" id="btnSaveEdit">Simpan (Draft)</button>
    </div>
  </div>
</div>
