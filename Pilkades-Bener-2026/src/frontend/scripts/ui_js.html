<script>
  const UI = {
    showError: function(msg) {
      const el = document.getElementById('errorAlert');
      if(el) { 
        el.textContent = msg; 
        el.style.display = 'block'; 
        el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      setTimeout(() => { if(el) el.style.display = 'none'; }, 6000);
    },
    showSuccess: function(msg) {
      const el = document.getElementById('successAlert');
      if(el) { 
        el.textContent = msg; 
        el.style.display = 'block'; 
        el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      setTimeout(() => { if(el) el.style.display = 'none'; }, 6000);
    },
    setLoading: function(btnId, isLoading, text) {
      const btn = document.getElementById(btnId);
      if(!btn) return;
      if(isLoading) {
        if (!btn.dataset.originalText) {
          btn.dataset.originalText = btn.innerHTML;
          btn.dataset.origWidth = btn.offsetWidth ? btn.offsetWidth + 'px' : 'auto';
        }
        btn.style.minWidth = btn.dataset.origWidth;
        btn.innerHTML = `<div class="spinner"></div> <span>${text || 'Memproses...'}</span>`;
        btn.disabled = true;
      } else {
        if(btn.dataset.originalText) {
          btn.innerHTML = btn.dataset.originalText;
        }
        btn.disabled = false;
        btn.style.minWidth = '';
      }
    },
    navigate: function(pageUrl) {
      let cachedUrl = sessionStorage.getItem('SCRIPT_URL');
      if (!cachedUrl) {
        google.script.run
          .withSuccessHandler(function(url) {
            sessionStorage.setItem('SCRIPT_URL', url);
            UI.navigate(pageUrl);
          })
          .getScriptUrl();
        return;
      }
      
      const fullUrl = cachedUrl + "?page=" + pageUrl;
      
      // Attempt top navigation immediately
      try {
        top.location.href = fullUrl;
      } catch(e) {}
      
      // Graceful fallback overlay if browser sandbox restricts auto-navigation
      setTimeout(() => {
        let existing = document.getElementById('navOverlay');
        if(existing) return;
        
        const overlay = document.createElement('div');
        overlay.id = 'navOverlay';
        overlay.style.cssText = "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.96); backdrop-filter:blur(6px); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; animation:fadeIn 0.2s ease-out;";
        overlay.innerHTML = `
          <div style="background:#ffffff; border:1px solid #e2e8f0; border-radius:16px; padding:32px 28px; max-width:440px; width:100%; text-align:center; box-shadow:0 12px 30px rgba(15,23,42,0.08);">
            <div style="width:52px; height:52px; background:#eff6ff; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 16px auto; font-size:26px;">
              ✨
            </div>
            <h2 style="margin-bottom:8px; font-size:20px; font-weight:700; color:#0f172a;">Data Berhasil Disimpan</h2>
            <p style="margin-bottom:24px; text-align:center; color:#64748b; font-size:14px; line-height:1.5;">
              Silakan klik tombol di bawah untuk melanjutkan ke halaman berikutnya.
            </p>
            <a href="${fullUrl}" target="_top" class="btn btn-primary" style="text-decoration:none; padding:12px 24px; font-size:15px; font-weight:600; width:100%;">
              Lanjutkan Sekarang ➔
            </a>
          </div>
        `;
        document.body.appendChild(overlay);
        
        // Reset any loading buttons
        const btns = document.querySelectorAll('button');
        btns.forEach(btn => {
          if(btn.disabled && btn.dataset.originalText) {
            btn.innerHTML = btn.dataset.originalText;
            btn.disabled = false;
          }
        });
      }, 350);
    },
    store: function(key, val) { sessionStorage.setItem(key, JSON.stringify(val)); },
    getStore: function(key) { let v = sessionStorage.getItem(key); return v ? JSON.parse(v) : null; },
    removeStore: function(key) { sessionStorage.removeItem(key); },
    clearStore: function() { sessionStorage.clear(); }
  };
</script>
