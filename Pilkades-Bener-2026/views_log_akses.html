<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('styles_main'); ?>
  <?!= include('styles_admin'); ?>
  <style>
    .log-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    .log-table th, .log-table td { padding: 12px; border-bottom: 1px solid var(--border); text-align: left; }
    .log-table th { background: var(--surface); font-weight: 600; color: var(--text); }
    .log-table tr:hover { background: #f8fafc; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
    .badge-success { background: #dcfce7; color: #166534; }
    .badge-danger { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body class="admin-layout">
  
  <?!= include('partials_sidebar'); ?>
  
  <div class="main-content">
    <div class="topbar">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <div>
        <?!= include('partials_notif_icon'); ?>
      </div>
    </div>
    
    <div class="content-wrapper">
      <div style="margin-bottom: 20px;">
        <a href="#" onclick="UI.navigate('dashboard'); return false;" style="text-decoration:none; color:var(--primary); font-weight:600;">← Kembali ke Dashboard</a>
      </div>
      <h2 class="mb-4">Log Akses</h2>
      
      <div class="card">
        <div id="loading" class="text-center text-muted">Memuat data log...</div>
        <div id="content" style="display:none; overflow-x: auto;">
          <table class="log-table">
            <thead>
              <tr>
                <th>Waktu</th>
                <th>Role</th>
                <th>Nama</th>
                <th>Grup KK</th>
                <th>Hasil</th>
              </tr>
            </thead>
            <tbody id="logList">
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <?!= include('scripts_api_js'); ?>
  <?!= include('scripts_ui_js'); ?>
  <?!= include('scripts_admin_js'); ?>
  <script>
    if (!UI.getStore('adminToken')) UI.navigate('admin-login');
    
    API.getLogAkses(UI.getStore('adminToken')).then(res => {
      document.getElementById('loading').style.display = 'none';
      if(res.success) {
        document.getElementById('content').style.display = 'block';
        let html = '';
        if(res.data.length === 0) {
          html = '<tr><td colspan="5" class="text-center text-muted">Belum ada log akses.</td></tr>';
        } else {
          res.data.forEach(log => {
            let badgeClass = log.Hasil && log.Hasil.toLowerCase().includes('sukses') ? 'badge-success' : 'badge-danger';
            html += `
              <tr>
                <td style="white-space:nowrap; font-size:12px;">${log.Timestamp}</td>
                <td><strong style="text-transform:uppercase;">${log.Role}</strong></td>
                <td>${log.Nama}</td>
                <td>${log['Grup KK'] || '-'}</td>
                <td><span class="badge ${badgeClass}">${log.Hasil}</span></td>
              </tr>
            `;
          });
        }
        document.getElementById('logList').innerHTML = html;
      } else {
        alert("Gagal memuat log: " + res.message);
      }
    });
  </script>
</body>
</html>
