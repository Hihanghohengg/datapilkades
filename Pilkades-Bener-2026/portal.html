<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Konfirmasi Pilkades Bener 2026</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --primary-border: #bfdbfe;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
        }
        
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        
        .setup-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 24px;
            background: var(--bg);
        }
        
        .card {
            background: var(--surface);
            padding: 40px 32px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
            border: 1px solid var(--border);
            max-width: 460px;
            width: 100%;
        }
        
        .brand-badge {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary);
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 9999px;
            border: 1px solid var(--primary-border);
            margin-bottom: 12px;
        }

        .card h2 {
            margin-top: 0;
            color: var(--text);
            margin-bottom: 6px;
            font-weight: 700;
            font-size: 22px;
            letter-spacing: -0.02em;
        }
        
        .card p {
            color: var(--muted);
            margin-bottom: 24px;
            font-size: 14.5px;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            margin-bottom: 20px;
        }
        
        .input-group label {
            font-weight: 600;
            font-size: 13.5px;
            color: #334155;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 14.5px;
            box-sizing: border-box;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: #ffffff;
            color: var(--text);
        }
        
        input[type="text"]:focus {
            border-color: var(--primary);
            background: #ffffff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.16);
        }
        
        .btn {
            padding: 13px 24px;
            background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            border: 1px solid var(--primary);
            cursor: pointer;
            width: 100%;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.25);
        }
        
        .btn:hover {
            background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.35);
        }
        
        .btn:active {
            transform: scale(0.985);
        }
        
        .error-msg {
            color: #dc2626;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }

        .alert-info {
            background: var(--primary-light);
            border: 1px solid var(--primary-border);
            color: #1e40af;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 24px;
            text-align: left;
            line-height: 1.5;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        .loader {
            display: none;
            border: 3px solid rgba(37, 99, 235, 0.15);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    
    <div class="setup-container" id="setup">
        <div class="card">
            <div class="brand-badge">PORTAL AKSES RESMI</div>
            <h2>Pilkades Bener 2026</h2>
            <p>Sistem Konfirmasi & Validasi Mandiri Pemilih</p>
            
            <div class="alert-info">
                <strong>Tips Akses:</strong> Membuka aplikasi melalui portal ini meminimalisir kendala izin Google Drive dan sandbox browser.
            </div>

            <div class="input-group">
                <label for="scriptUrl">URL Web App Google Apps Script:</label>
                <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/AKfycb.../exec">
                <div class="error-msg" id="errorMsg">URL tidak valid. Pastikan berakhiran /exec</div>
            </div>
            
            <button class="btn" onclick="loadApp()" id="btnSubmit">Buka Aplikasi ➔</button>
            <div class="loader" id="loader"></div>
            
            <div style="margin-top: 24px; font-size: 13px; color: var(--muted);">
                <a href="#" onclick="clearSaved()" style="color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--muted);">Reset Data Tersimpan</a>
            </div>
        </div>
    </div>
    
    <!-- Aplikasi akan di-embed di sini -->
    <iframe id="appFrame" src="" allow="fullscreen"></iframe>

    <script>
        function loadApp() {
            const errorMsg = document.getElementById('errorMsg');
            let url = document.getElementById('scriptUrl').value.trim();
            
            errorMsg.style.display = 'none';
            
            if(!url) {
                errorMsg.textContent = "URL tidak boleh kosong.";
                errorMsg.style.display = 'block';
                return;
            }
            
            if(!url.includes('script.google.com')) {
                errorMsg.textContent = "Pastikan ini adalah URL dari Google Apps Script.";
                errorMsg.style.display = 'block';
                return;
            }

            // Perbaiki otomatis jika user salah copy (berakhiran /edit)
            if(url.endsWith('/edit')) {
                url = url.replace('/edit', '/exec');
            }
            
            // Simpan ke local storage agar user tidak perlu input ulang nantinya
            localStorage.setItem('pilkades_url', url);
            
            // Tampilkan loading sebentar agar smooth
            document.getElementById('btnSubmit').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            
            setTimeout(() => {
                document.getElementById('setup').style.display = 'none';
                const frame = document.getElementById('appFrame');
                frame.src = url;
                frame.style.display = 'block';
            }, 500);
        }
        
        function clearSaved() {
            localStorage.removeItem('pilkades_url');
            document.getElementById('scriptUrl').value = '';
            alert('Data tersimpan telah dihapus.');
        }

        // Auto load jika sebelumnya sudah pernah memasukkan URL
        window.onload = function() {
            const savedUrl = localStorage.getItem('pilkades_url');
            if(savedUrl) {
                document.getElementById('scriptUrl').value = savedUrl;
                loadApp();
            }
        };
    </script>
</body>
</html>
