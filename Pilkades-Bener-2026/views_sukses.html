<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('styles_main'); ?>
</head>
<body>
  <div class="container" style="margin-top: 50px;">
    <div class="card text-center" style="padding: 40px 20px;">
      <div style="font-size: 64px; margin-bottom: 20px;">✅</div>
      <h2 class="mb-4">Terima Kasih!</h2>
      
      <p id="msgSukses" class="text-muted mb-4" style="font-size: 16px;">
        Laporan Anda sudah dikirim.
      </p>
      
      <div id="pdfArea" style="display:none; margin-bottom: 24px;">
        <button class="btn btn-success" id="btnPdf" onclick="downloadPdf()">DOWNLOAD FORM PDF</button>
      </div>
      
      <button class="btn btn-outline" onclick="UI.clearStore(); UI.navigate('login');">Kembali ke Awal</button>
    </div>
  </div>

  <?!= include('scripts_api_js'); ?>
  <?!= include('scripts_ui_js'); ?>
  <?!= include('scripts_app_js'); ?>
  <script>
    if (!UI.getStore('wargaAuth')) {
      UI.navigate('login');
    } else {
      const stat = UI.getStore('statusLaporan');
      if(stat === 'sesuai') {
        document.getElementById('msgSukses').innerHTML = "Data keluarga Anda sudah sesuai.<br>Silakan download form PDF di bawah ini.";
        document.getElementById('pdfArea').style.display = 'block';
      } else {
        document.getElementById('msgSukses').innerHTML = "Laporan perubahan Anda sudah dikirim.<br>Admin akan meninjau segera.";
      }
    }

    
    function downloadPdf() {
      UI.setLoading('btnPdf', true);
      const auth = UI.getStore('wargaAuth');
      API.generatePDF(auth.grupKK).then(res => {
        UI.setLoading('btnPdf', false);
        if(res.success) {
          document.getElementById('btnPdf').outerHTML = `<a href="${res.url}" target="_blank" class="btn btn-success">⬇️ KLIK DI SINI UNTUK MENGUNDUH PDF</a>`;
        } else {
          alert("Gagal generate PDF: " + res.message);
        }
      });
    }
  </script>
</body>
</html>
