<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('styles_main'); ?>
  <?!= include('styles_admin'); ?>
  <style>
    .layout-laporan { display: flex; gap: 20px; height: calc(100vh - 120px); }
    .col-list { width: 350px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; }
    .list-header { padding: 16px; border-bottom: 1px solid var(--border); font-weight: 600; }
    .list-body { flex: 1; overflow-y: auto; padding: 10px; }
    .lap-item { padding: 12px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 10px; cursor: pointer; }
    .lap-item:hover { border-color: var(--primary); }
    .lap-item.active { background: #EFF6FF; border-color: var(--primary); }
    .lap-item.baru { border-left: 4px solid var(--danger); }
    .lap-item.dibaca { border-left: 4px solid var(--warning); }
    
    .col-detail { flex: 1; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
    .detail-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
    
    @media (max-width: 768px) {
      .layout-laporan { flex-direction: column; height: auto; }
      .col-list { width: 100%; height: 300px; }
    }
  </style>
</head>
<body class="admin-layout">
  
  <?!= include('partials_sidebar'); ?>
  
  <div class="main-content">
    <div class="topbar">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <div><?!= include('partials_notif_icon'); ?></div>
    </div>
    
    <div class="content-wrapper">
      <div class="layout-laporan">
        <!-- Kiri: List Laporan -->
        <div class="col-list">
          <div class="list-header" style="display:flex; gap:10px; padding: 10px 16px;">
            <button class="btn btn-outline" style="flex:1; padding:6px; min-height:0; border:none; background:var(--surface);" id="tabBaru" onclick="switchLapTab('baru')">Baru Masuk</button>
            <button class="btn btn-outline" style="flex:1; padding:6px; min-height:0; border:none; background:transparent;" id="tabRiwayat" onclick="switchLapTab('riwayat')">Riwayat</button>
          </div>
          <div class="list-body" id="lapList">
            <div class="text-center text-muted" style="margin-top:20px;">Memuat...</div>
          </div>
        </div>
        
        <!-- Kanan: Detail & DB -->
        <div class="col-detail">
          <!-- Detail Laporan -->
          <div class="detail-card" id="lapDetail" style="display:none;">
            <div style="display:flex; justify-content:space-between; margin-bottom:16px;">
              <h3 id="detTitle">Detail Laporan</h3>
              <span id="detStatus" class="badge"></span>
            </div>
            <div class="grid-2 mb-4">
              <div>
                <div class="text-muted" style="font-size:12px;">Dari (Warga)</div>
                <div id="detDari" style="font-weight:600;"></div>
              </div>
              <div>
                <div class="text-muted" style="font-size:12px;">Grup KK</div>
                <div id="detGrupKK" style="font-weight:600;"></div>
              </div>
            </div>
            
            <div style="background:var(--bg); padding:16px; border-radius:8px; margin-bottom:20px; font-family:monospace; font-size:13px; white-space:pre-wrap;" id="detData"></div>
            
            <div id="actionArea" style="display:flex; gap:10px; flex-wrap:wrap;">
              <button class="btn btn-success" id="btnApprove" onclick="doApprove()">✅ APPROVE (UPDATE DB)</button>
              <button class="btn btn-outline" style="color:var(--danger)" onclick="doTolak()">❌ TOLAK</button>
              <button class="btn btn-primary" onclick="bukaTindakLanjut()">🔧 TINDAK LANJUT (EDIT DB)</button>
            </div>
          </div>
          
          <!-- Tabel Inline Edit -->
          <div class="detail-card" id="dbEditor" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
              <h3>Data KK <span id="dbGrupKkLabel"></span></h3>
              <button class="btn btn-outline" style="padding:4px 12px; min-height:0; width:auto;" onclick="addRow()">+ Tambah Anggota</button>
            </div>
            
            <div class="table-wrapper mb-4">
              <table id="tblKk">
                <thead><tr><th>No</th><th>Nama</th><th>JK</th><th>Aksi</th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
            
            <div style="text-align:right;">
              <button class="btn btn-primary" style="display:inline-block; width:auto;" id="btnSaveDb" onclick="saveDbBatch()">💾 Simpan Perubahan DB</button>
            </div>
          </div>
          
        </div>
      </div>
    </div>
  </div>

  <?!= include('partials_modal_edit'); ?>

  <?!= include('scripts_api_js'); ?>
  <?!= include('scripts_ui_js'); ?>
  <?!= include('scripts_admin_js'); ?>
  
  <script>
    const token = UI.getStore('adminToken');
    let allLaporan = [];
    let activeLap = null;
    let dataKkCurrent = [];
    let dbUpdates = []; // { action: 'update'|'delete', rowIndex: X, data: {} }
    let lapTab = 'baru';
    
    if(token) loadLaporan();
    
    function switchLapTab(tab) {
      lapTab = tab;
      document.getElementById('tabBaru').style.background = tab === 'baru' ? 'var(--surface)' : 'transparent';
      document.getElementById('tabBaru').style.fontWeight = tab === 'baru' ? '600' : '400';
      document.getElementById('tabRiwayat').style.background = tab === 'riwayat' ? 'var(--surface)' : 'transparent';
      document.getElementById('tabRiwayat').style.fontWeight = tab === 'riwayat' ? '600' : '400';
      renderList();
    }
    
    function loadLaporan() {
      API.getLaporanList(token).then(res => {
        if(res.success) {
          allLaporan = res.data.filter(d => d.Jenis !== "Sesuai"); // Hide auto-approved ones
          renderList();
        }
      });
    }
    
    function renderList() {
      const container = document.getElementById('lapList');
      
      let filtered = allLaporan.filter(lap => {
        if (lapTab === 'baru') return lap.Status === 'Baru' || lap.Status === 'Dibaca';
        else return lap.Status === 'Selesai' || lap.Status === 'Ditolak';
      });
      
      if(filtered.length === 0) {
        container.innerHTML = '<div class="text-center text-muted" style="margin-top:20px;">Belum ada laporan.</div>';
        return;
      }
      
      let html = '';
      filtered.forEach(lap => {
        let cls = lap.Status === 'Baru' ? 'baru' : (lap.Status === 'Dibaca' ? 'dibaca' : '');
        let bg = activeLap && activeLap.Id === lap.Id ? 'active' : '';
        html += `
          <div class="lap-item ${cls} ${bg}" onclick="selectLap(${lap.Id})">
            <div style="font-size:12px; color:var(--muted);">${lap.Timestamp}</div>
            <div style="font-weight:600;">${lap.GrupKK}</div>
            <div>${lap['Jenis Laporan']}</div>
          </div>
        `;
      });
      container.innerHTML = html;
    }
    
    function selectLap(id) {
      activeLap = allLaporan.find(x => x.Id === id);
      renderList();
      
      // Mark read
      if(activeLap.Status === 'Baru') {
        API.markAsRead(token, id).then(() => { activeLap.Status = 'Dibaca'; renderList(); });
      }
      
      // Show Detail
      document.getElementById('lapDetail').style.display = 'block';
      document.getElementById('detTitle').textContent = activeLap['Jenis Laporan'];
      document.getElementById('detStatus').textContent = activeLap.Status;
      document.getElementById('detStatus').className = 'badge badge-' + (activeLap.Status === 'Selesai' ? 'sesuai' : 'baru');
      document.getElementById('detDari').textContent = activeLap['Nama Pengisi'];
      document.getElementById('detGrupKK').textContent = activeLap.GrupKK;
      
      try {
        let j = JSON.parse(activeLap['Data Laporan']);
        document.getElementById('detData').textContent = JSON.stringify(j, null, 2);
      } catch(e) {
        document.getElementById('detData').textContent = activeLap['Data Laporan'];
      }
      
      document.getElementById('actionArea').style.display = activeLap.Status === 'Selesai' || activeLap.Status === 'Ditolak' ? 'none' : 'flex';
      
      // Sembunyikan DB Table pada awalnya, baru dibuka saat Tindak Lanjut
      document.getElementById('dbEditor').style.display = 'none';
    }
    
    function bukaTindakLanjut() {
      document.getElementById('dbEditor').style.display = 'block';
      document.getElementById('dbGrupKkLabel').textContent = activeLap.GrupKK;
      dbUpdates = [];
      loadDbTable(activeLap.GrupKK);
    }
    
    function loadDbTable(grupKK) {
      const tb = document.querySelector('#tblKk tbody');
      tb.innerHTML = '<tr><td colspan="4" class="text-center">Memuat data...</td></tr>';
      
      API.getKeluarga(grupKK).then(res => {
        if(res.success) {
          dataKkCurrent = res.data;
          renderDbTable();
        }
      });
    }
    
    function renderDbTable() {
      const tb = document.querySelector('#tblKk tbody');
      tb.innerHTML = '';
      dataKkCurrent.forEach((p, idx) => {
        if(String(p.Keterangan).indexOf('Dihapus') > -1) return;
        tb.innerHTML += `
          <tr>
            <td>${idx+1}</td>
            <td>${p.Nama}<br><small class="text-muted">${p.Status} | ${p.Umur} th</small></td>
            <td>${p.JK}</td>
            <td>
              <button class="btn btn-outline" style="padding:4px 8px; display:inline-block; min-height:0; width:auto;" onclick="editRow(${idx})">✏</button>
              <button class="btn btn-outline" style="padding:4px 8px; display:inline-block; min-height:0; width:auto; color:var(--danger);" onclick="deleteRow(${idx})">🗑</button>
            </td>
          </tr>
        `;
      });
    }
    
    function doApprove() {
      if(!confirm("Approve akan otomatis mengubah Database. Lanjutkan?")) return;
      UI.setLoading('btnApprove', true);
      API.approveLaporan(token, activeLap.Id, activeLap['Jenis Laporan'], activeLap['Data Laporan'], activeLap.GrupKK).then(res => {
        UI.setLoading('btnApprove', false);
        if(res.success) {
          activeLap.Status = 'Selesai';
          selectLap(activeLap.Id);
        } else {
          alert("Error: " + res.message);
        }
      });
    }
    
    function doTolak() {
      let cat = prompt("Alasan penolakan:");
      if(cat === null) return;
      API.tolakLaporan(token, activeLap.Id, cat).then(res => {
        if(res.success) {
          activeLap.Status = 'Ditolak';
          selectLap(activeLap.Id);
        }
      });
    }
    
    // Inline Edit Logic
    function editRow(idx) {
      let p = dataKkCurrent[idx];
      document.getElementById('editRowIdx').value = idx;
      document.getElementById('editNama').value = p.Nama;
      document.getElementById('editNIK').value = p.NIK || "";
      document.getElementById('editJK').value = p.JK;
      document.getElementById('editTempat').value = p.TempatLahir;
      document.getElementById('editTgl').value = p.TglLahir;
      document.getElementById('editStatus').value = p.Status;
      document.getElementById('editAlamat').value = p.Alamat;
      document.getElementById('modalEdit').style.display = 'flex';
    }
    
    document.getElementById('btnSaveEdit').onclick = function() {
      let idx = document.getElementById('editRowIdx').value;
      if(idx === "") return; // Tambah baru (kalau diimplementasi)
      
      let p = dataKkCurrent[idx];
      p.Nama = document.getElementById('editNama').value;
      p.NIK = document.getElementById('editNIK').value;
      p.JK = document.getElementById('editJK').value;
      p.TempatLahir = document.getElementById('editTempat').value;
      p.TglLahir = document.getElementById('editTgl').value;
      p.Status = document.getElementById('editStatus').value;
      p.Alamat = document.getElementById('editAlamat').value;
      
      dbUpdates.push({ action: 'update', rowIndex: p.RowIndex, data: p });
      document.getElementById('modalEdit').style.display = 'none';
      renderDbTable();
    };
    
    function deleteRow(idx) {
      if(!confirm("Yakin hapus dari DB?")) return;
      let p = dataKkCurrent[idx];
      p.Keterangan = "Dihapus (Admin)";
      dbUpdates.push({ action: 'delete', rowIndex: p.RowIndex });
      renderDbTable();
    }
    
    function saveDbBatch() {
      if(dbUpdates.length === 0) { alert("Tidak ada perubahan"); return; }
      UI.setLoading('btnSaveDb', true);
      API.updateWargaBatch(token, dbUpdates).then(res => {
        UI.setLoading('btnSaveDb', false);
        if(res.success) {
          alert("Tersimpan!");
          dbUpdates = [];
          loadDbTable(activeLap.GrupKK);
        } else {
          alert("Error: " + res.message);
        }
      });
    }
  </script>
</body>
</html>
