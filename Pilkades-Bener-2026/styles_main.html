<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #3b82f6; 
    --primary-hover: #2563eb;
    --success: #10b981;
    --success-hover: #059669;
    --warning: #f59e0b;
    --danger: #ef4444;
    --danger-hover: #dc2626;
    --neutral: #0f172a; 
    --muted: #64748b;
    --bg: #f8fafc;
    --surface: #ffffff;
    --border: #e2e8f0;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    --radius: 16px;
    --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body { 
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
    background-color: var(--bg); 
    background-image: radial-gradient(circle at 50% 0%, #e0e7ff 0%, transparent 50%);
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: var(--neutral); 
    line-height: 1.6; 
    padding: 24px 16px; 
    min-height: 100vh;
  }
  
  .container { max-width: 640px; margin: 0 auto; }
  
  .card { 
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: var(--radius); 
    padding: 32px 24px; 
    box-shadow: var(--shadow-md); 
    border: 1px solid rgba(255, 255, 255, 0.6); 
    margin-bottom: 24px; 
    animation: fadeIn 0.4s ease-out forwards;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .text-center { text-align: center; }
  .mb-2 { margin-bottom: 8px; }
  .mb-4 { margin-bottom: 16px; }
  .mt-4 { margin-top: 16px; }
  .text-primary { color: var(--primary); }
  .text-muted { color: var(--muted); font-size: 0.9rem; }
  
  h1, h2, h3 { color: var(--neutral); letter-spacing: -0.025em; }
  h1 { font-size: 28px; font-weight: 700; margin-bottom: 12px; }
  h2 { font-size: 22px; font-weight: 600; margin-bottom: 16px; }
  h3 { font-size: 18px; font-weight: 600; }
  
  /* Forms */
  label { display: block; font-weight: 500; margin-bottom: 8px; font-size: 14px; color: #334155; }
  input, select, textarea { 
    width: 100%; 
    min-height: 48px; 
    padding: 12px 16px; 
    border: 1px solid var(--border); 
    border-radius: 12px; 
    margin-bottom: 20px; 
    font-size: 16px; 
    font-family: inherit;
    background: #fff; 
    transition: var(--transition);
    box-shadow: var(--shadow-sm);
  }
  input:focus, select:focus, textarea:focus { 
    outline: none; 
    border-color: var(--primary); 
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); 
  }
  
  /* Buttons */
  .btn { 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    gap: 8px;
    width: 100%; 
    min-height: 48px; 
    padding: 12px 24px; 
    border: none; 
    border-radius: 12px; 
    font-size: 16px; 
    font-weight: 600; 
    cursor: pointer; 
    text-decoration: none; 
    transition: var(--transition); 
  }
  .btn:disabled { opacity: 0.65; cursor: not-allowed; transform: none !important; }
  .btn:not(:disabled):active { transform: scale(0.98); }
  
  .btn-primary { 
    background: linear-gradient(135deg, var(--primary), var(--primary-hover)); 
    color: white; 
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
  }
  .btn-primary:hover:not(:disabled) { 
    box-shadow: 0 6px 16px rgba(59, 130, 246, 0.35); 
    transform: translateY(-1px);
  }
  
  .btn-success { 
    background: linear-gradient(135deg, var(--success), var(--success-hover)); 
    color: white; 
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
  }
  .btn-success:hover:not(:disabled) { box-shadow: 0 6px 16px rgba(16, 185, 129, 0.35); transform: translateY(-1px); }
  
  .btn-danger { 
    background: linear-gradient(135deg, var(--danger), var(--danger-hover)); 
    color: white; 
  }
  
  .btn-outline { 
    background: transparent; 
    border: 2px solid var(--border); 
    color: var(--neutral); 
    box-shadow: none;
  }
  .btn-outline:hover:not(:disabled) { 
    background: var(--bg); 
    border-color: #cbd5e1;
  }
  
  /* Alerts */
  .alert { padding: 16px; border-radius: 12px; margin-bottom: 24px; display: none; font-weight: 500; font-size: 15px; animation: fadeIn 0.3s ease-out; }
  .alert-error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  .alert-success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
  
  /* Spinner */
  .spinner {
    border: 3px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    border-top: 3px solid #fff;
    width: 20px;
    height: 20px;
    animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  
  /* Utils */
  .header-logo { text-align: center; margin-bottom: 32px; }
  .header-logo img { max-width: 90px; margin-bottom: 16px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
  
  @media (max-width: 480px) {
    body { padding: 16px 12px; }
    .card { padding: 24px 16px; }
  }
</style>
