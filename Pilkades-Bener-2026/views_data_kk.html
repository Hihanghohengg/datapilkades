<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('styles_main'); ?>
</head>
<body>
  <div class="container">
    <div class="card">
      <div style="margin-bottom: 20px;">
        <a href="#" onclick="UI.clearStore(); UI.navigate('login'); return false;" style="text-decoration:none; color:var(--primary); font-weight:600;">← Kembali ke Login</a>
      </div>
      <h2 class="mb-4" id="titleKk">Data Keluarga</h2>
      
      <div id="listAnggota" style="margin-bottom: 24px;">
        <!-- List inserted by JS -->
      </div>
      
      <div id="konfirmasiArea">
        <div class="text-center mb-4">
          <p style="font-weight:600; font-size:18px;">Apakah data sudah sesuai?</p>
        </div>
        
        <div id="errorAlert" class="alert alert-error"></div>
        
        <button class="btn btn-success mb-4" id="btnSesuai" onclick="submitSesuai()">SESUAI</button>
        <button class="btn btn-danger" onclick="UI.navigate('pilih-perubahan')">BELUM SESUAI</button>
      </div>
      
      <div id="sudahSesuaiArea" style="display:none; text-align:center;">
        <div class="alert alert-success mb-4">✅ Data keluarga Anda sudah dikonfirmasi.</div>
        <button class="btn btn-success" id="btnPdf" onclick="downloadPdf()">📄 DOWNLOAD FORM PDF</button>
      </div>
    </div>
  </div>

  <?!= include('scripts_api_js'); ?>
  <?!= include('scripts_ui_js'); ?>
  <?!= include('scripts_app_js'); ?>
  <script>
    const auth = UI.getStore('wargaAuth');
    const data = UI.getStore('wargaData');
    
    if(!auth || !data) {
      UI.navigate('login');
    } else {
      document.getElementById('titleKk').textContent = "Data Keluarga " + (data[0] ? data[0].KepalaKeluarga || "" : "");
      
      let html = "";
      data.forEach((p, idx) => {
        const ket = String(p.Keterangan||"").toLowerCase();
        if(ket.includes("meninggal") || ket.includes("pindah") || ket.includes("dihapus")) return;
        html += `
          <div style="padding:12px; border-bottom:1px solid var(--border);">
            <div style="font-weight:600;">${idx+1}. ${p.Nama} (${p.Umur} th)</div>
            <div class="text-muted">✅ Pemilih - ${p.Status}</div>
          </div>
        `;
      });
      document.getElementById('listAnggota').innerHTML = html;
      
      // Jika statusnya sudah Sesuai atau direvisi, sembunyikan tombol konfirmasi dan munculkan tombol PDF
      if (data[0] && (data[0].StatusKonfirmasi === 'Sesuai' || data[0].StatusKonfirmasi === 'Sudah Direvisi')) {
        document.getElementById('konfirmasiArea').style.display = 'none';
        document.getElementById('sudahSesuaiArea').style.display = 'block';
      }
    }
    
    function submitSesuai() {
      UI.setLoading('btnSesuai', true);
      API.submitSesuai(auth.grupKK, auth.nama).then(res => {
        UI.setLoading('btnSesuai', false);
        if(res.success) {
          UI.store('statusLaporan', 'sesuai');
          UI.navigate('sukses');
        } else {
          UI.showError(res.message);
        }
      });
    }

    function downloadPdf() {
      UI.setLoading('btnPdf', true);
      API.generatePDF(auth.grupKK).then(res => {
        UI.setLoading('btnPdf', false);
        if(res.success) {
          document.getElementById('btnPdf').outerHTML = `<a href="${res.url}" target="_blank" class="btn btn-primary" style="margin-top:10px;">⬇️ KLIK DI SINI UNTUK MENGUNDUH PDF</a>`;
        } else {
          alert("Gagal generate PDF: " + res.message);
        }
      });
    }
  </script>
</body>
</html>
