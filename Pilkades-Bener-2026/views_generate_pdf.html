<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('styles_main'); ?>
  <?!= include('styles_admin'); ?>
</head>
<body class="admin-layout">
  
  <?!= include('partials_sidebar'); ?>
  
  <div class="main-content">
    <div class="topbar">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <div><?!= include('partials_notif_icon'); ?></div>
    </div>
    
    <div class="content-wrapper">
      <h2 class="mb-4">Generate PDF Manual</h2>
      <div class="card">
        <label>Masukkan Nomor Grup KK (Contoh: KK-001)</label>
        <div style="display:flex; gap:10px;">
          <input type="text" id="grupkk" placeholder="KK-001" style="margin-bottom:0;">
          <button class="btn btn-primary" id="btnGen" style="width:150px; margin-bottom:0;" onclick="genPdf()">Generate</button>
        </div>
        <div id="pdfResult" style="margin-top:20px; display:none;">
          <a href="#" id="pdfLink" target="_blank" class="btn btn-success" style="display:inline-block; width:auto;">📄 Download PDF</a>
        </div>
      </div>
    </div>
  </div>

  <?!= include('scripts_api_js'); ?>
  <?!= include('scripts_ui_js'); ?>
  <?!= include('scripts_admin_js'); ?>
  <script>
    function genPdf() {
      const g = document.getElementById('grupkk').value;
      if(!g) return;
      UI.setLoading('btnGen', true);
      const token = UI.getStore('adminToken');
      API.generatePDF(g, token).then(res => {
        UI.setLoading('btnGen', false);
        if(res.success) {
          document.getElementById('pdfResult').style.display = 'block';
          document.getElementById('pdfLink').href = res.url;
        } else {
          alert("Error: " + res.message);
        }
      });
    }
  </script>
</body>
</html>
