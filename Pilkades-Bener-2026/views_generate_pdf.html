<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('styles_main'); ?>
  <?!= include('styles_admin'); ?>
</head>
<body class="admin-layout">
  
  <?!= include('partials_sidebar'); ?>
  
  <div class="main-content">
    <div class="topbar">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <div>
        <?!= include('partials_notif_icon'); ?>
      </div>
    </div>
    
    <div class="content-wrapper">
      <div style="margin-bottom: 20px;">
        <a href="#" onclick="UI.navigate('dashboard'); return false;" style="text-decoration:none; color:var(--primary); font-weight:600;">← Kembali ke Dashboard</a>
      </div>
      <h2 class="mb-4">Generate PDF KK</h2>
      
      <div class="card">
        <label>Masukkan Grup KK (Nomor KK)</label>
        <div style="display:flex; gap:10px; margin-bottom: 16px;">
          <input type="text" id="inpGrupKK" placeholder="Contoh: 330605..." autocomplete="off">
          <button class="btn btn-primary" id="btnGen" onclick="generate()" style="white-space: nowrap;">📄 GENERATE</button>
        </div>
        
        <div id="resultArea" style="display:none; padding: 20px; background: var(--surface); border-radius: 8px; text-align:center;">
          <h3 class="mb-2 text-success">Berhasil Dibuat!</h3>
          <div id="linkArea"></div>
        </div>
        
        <div id="errorAlert" class="alert alert-error" style="display:none; margin-top: 16px;"></div>
      </div>
    </div>
  </div>

  <?!= include('scripts_api_js'); ?>
  <?!= include('scripts_ui_js'); ?>
  <?!= include('scripts_admin_js'); ?>
  <script>
    if (!UI.getStore('adminToken')) UI.navigate('admin-login');
    
    function generate() {
      const grupKK = document.getElementById('inpGrupKK').value.trim();
      if(!grupKK) {
        UI.showError("Masukkan nomor Grup KK terlebih dahulu.");
        return;
      }
      
      UI.setLoading('btnGen', true);
      document.getElementById('resultArea').style.display = 'none';
      
      API.generatePDF(grupKK, UI.getStore('adminToken')).then(res => {
        UI.setLoading('btnGen', false);
        if(res.success) {
          document.getElementById('resultArea').style.display = 'block';
          document.getElementById('linkArea').innerHTML = `
            <a href="${res.url}" target="_top" class="btn btn-primary mt-2">⬇️ KLIK DI SINI UNTUK MENGUNDUH</a>
          `;
        } else {
          UI.showError(res.message);
        }
      }).catch(e => {
        UI.setLoading('btnGen', false);
        UI.showError(e.message || "Gagal menghubungi server.");
      });
    }
  </script>
</body>
</html>
