      <div id="content" style="display:none;">
        <div class="grid-2 mb-4" style="grid-template-columns: repeat(3, 1fr);">
          <div class="card" style="margin:0; text-align:center;">
            <div style="font-size:14px; color:var(--muted);">Total KK</div>

  <?!= include('scripts_api_js'); ?>

  <script>
    let wargaList = [];

    const token = UI.getStore('adminToken');
    if(token) {
      API.getDashboardStats(token).then(res => {
        document.getElementById('loading').style.display = 'none';
        if(res) {
          document.getElementById('content').style.display = 'block';
          document.getElementById('stTotal').textContent = res.totalKK;
          document.getElementById('stSudah').textContent = res.sesuai;
          document.getElementById('stBelum').textContent = res.belum;
          document.getElementById('stReview').textContent = res.menungguReview;
          document.getElementById('stDirevisi').textContent = res.sudahDirevisi;
          wargaList = res.list || [];
        }
      });
    }
  </script>
