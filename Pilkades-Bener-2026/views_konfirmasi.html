<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('styles_main'); ?>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2 class="text-center mb-4">Konfirmasi KK</h2>
      <div id="loading" class="text-center">Memuat data...</div>
      
      <div id="content" style="display:none;">
        <p class="text-center mb-2">Apakah ini alamat keluarga Anda?</p>
        <div style="background:var(--bg); padding:16px; border-radius:8px; margin-bottom:24px; text-align:center;">
          <h3 id="kepalaKk"></h3>
          <p id="alamatKk" class="text-muted"></p>
        </div>
        
        <button class="btn btn-primary mb-4" onclick="UI.navigate('data-kk')">YA, BENAR</button>
        <button class="btn btn-outline" onclick="UI.clearStore(); UI.navigate('login');">BUKAN</button>
      </div>
    </div>
  </div>

  <?!= include('scripts_api_js'); ?>
  <?!= include('scripts_ui_js'); ?>
  <?!= include('scripts_app_js'); ?>
  <script>
    const auth = UI.getStore('wargaAuth');
    if(auth) {
      API.getKeluarga(auth.grupKK).then(res => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        if(res.success) {
          document.getElementById('kepalaKk').textContent = "Keluarga " + (res.kepala || "-");
          document.getElementById('alamatKk').textContent = res.alamat || "-";
          UI.store('wargaData', res.data); // Store data for next page
        }
      });
    }
  </script>
</body>
</html>
