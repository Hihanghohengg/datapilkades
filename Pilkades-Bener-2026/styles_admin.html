<style>
  body.admin-layout { 
    padding: 0; 
    display: flex; 
    height: 100vh; 
    overflow: hidden; 
    background: #f1f5f9; 
    background-image: none; /* Override the radial gradient */
  }
  
  .sidebar { 
    width: 260px; 
    background: var(--surface); 
    border-right: 1px solid var(--border); 
    display: flex; 
    flex-direction: column; 
    height: 100%; 
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
    z-index: 40;
    box-shadow: 2px 0 10px rgba(0,0,0,0.02);
  }
  .sidebar-header { 
    padding: 24px 20px; 
    border-bottom: 1px solid var(--border); 
    font-weight: 700; 
    font-size: 20px; 
    color: var(--primary); 
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .sidebar-nav { flex: 1; padding: 20px 12px; overflow-y: auto; }
  .nav-item { 
    display: flex; 
    align-items: center; 
    padding: 12px 16px; 
    margin-bottom: 8px;
    color: var(--neutral); 
    text-decoration: none; 
    font-weight: 500;
    border-radius: 10px;
    transition: var(--transition);
  }
  .nav-item:hover { background: var(--bg); color: var(--primary); transform: translateX(4px); }
  .nav-item.active { background: var(--primary-light, #eff6ff); color: var(--primary); font-weight: 600; }
  
  .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #f1f5f9; }
  .topbar { 
    height: 70px; 
    background: rgba(255,255,255,0.8); 
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border); 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    padding: 0 24px; 
    z-index: 10;
  }
  .content-wrapper { flex: 1; padding: 32px; overflow-y: auto; }
  
  .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: 0.02em; }
  .badge-baru { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
  .badge-sesuai { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
  .badge-review { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
  .badge-direvisi { background: #dbeafe; color: #1d4ed8; border: 1px solid #bfdbfe; }
  
  .table-wrapper { 
    overflow-x: auto; 
    background: var(--surface); 
    border-radius: var(--radius); 
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
  }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  th, td { padding: 16px 20px; border-bottom: 1px solid var(--border); font-size: 14px; }
  th { background: #f8fafc; font-weight: 600; color: #475569; text-transform: uppercase; font-size: 12px; letter-spacing: 0.05em; }
  tr:last-child td { border-bottom: none; }
  tr { transition: background 0.2s; }
  tr:hover { background: #f8fafc; }
  
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
  
  .clickable-card { 
    cursor: pointer; 
    transition: var(--transition); 
    border-top: 4px solid transparent;
  }
  .clickable-card:hover { 
    transform: translateY(-4px); 
    box-shadow: var(--shadow-lg); 
    border-color: var(--primary);
  }
  
  @media (max-width: 768px) {
    .sidebar { position: absolute; transform: translateX(-100%); box-shadow: 4px 0 24px rgba(0,0,0,0.1); }
    .sidebar.open { transform: translateX(0); }
    .content-wrapper { padding: 16px; }
    .topbar { padding: 0 16px; }
    .menu-toggle { display: block !important; }
  }
  .menu-toggle { display: none; background: none; border: none; font-size: 24px; cursor: pointer; color: var(--neutral); padding: 8px; border-radius: 8px; }
  .menu-toggle:hover { background: var(--bg); }
</style>
