<style>
  /* Override body for admin layout */
  body.admin-layout { padding: 0; display: flex; height: 100vh; overflow: hidden; background: #F3F4F6; }
  
  .sidebar { width: 250px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100%; transition: transform 0.3s; z-index: 40; }
  .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 18px; color: var(--primary); }
  .sidebar-nav { flex: 1; padding: 16px 0; overflow-y: auto; }
  .nav-item { display: flex; align-items: center; padding: 12px 20px; color: var(--neutral); text-decoration: none; font-weight: 500; }
  .nav-item:hover { background: var(--bg); color: var(--primary); }
  .nav-item.active { background: #EFF6FF; color: var(--primary); border-right: 3px solid var(--primary); }
  
  .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { height: 60px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
  .content-wrapper { flex: 1; padding: 20px; overflow-y: auto; }
  
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge-baru { background: #FEE2E2; color: #DC2626; }
  .badge-sesuai { background: #DCFCE7; color: #16A34A; }
  .badge-review { background: #FEF3C7; color: #D97706; }
  .badge-direvisi { background: #DBEAFE; color: #2563EB; }
  
  .table-wrapper { overflow-x: auto; background: var(--surface); border-radius: 8px; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  th, td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
  th { background: #F9FAFB; font-weight: 600; }
  
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  
  @media (max-width: 768px) {
    .sidebar { position: absolute; transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .grid-2 { grid-template-columns: 1fr; }
    .menu-toggle { display: block !important; }
  }
  .menu-toggle { display: none; background: none; border: none; font-size: 24px; cursor: pointer; color: var(--neutral); }
</style>
